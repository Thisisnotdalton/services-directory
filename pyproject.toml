[project]
name = "services-directory"
version = "0.1.0"
description = "Simple web server to provide a directory of available services for the requesting user."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.136.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.13.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.setuptools.package-data]
"app" = ["templates/*.html"]